<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes 策略数据中心</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2333; --border: #2d333b;
    --text: #e6edf3; --muted: #8b949e;
    --up: #f0506e; --down: #2ea86e;   /* 中式行情: 涨红跌绿 */
    --accent: #4e8ef7; --gold: #d9a53f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; }
  header { padding: 28px 0 8px; }
  header h1 { font-size: 26px; letter-spacing: 1px; }
  header h1 span { color: var(--accent); }
  header p { color: var(--muted); margin-top: 6px; font-size: 13px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 20px; }
  .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .kpi .label { font-size: 12px; color: var(--muted); }
  .kpi .value { font-size: 22px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .up { color: var(--up); } .down { color: var(--down); } .gold { color: var(--gold); }
  h2 { font-size: 18px; margin: 34px 0 14px; padding-left: 10px; border-left: 3px solid var(--accent); }
  .charts { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; }
  @media (max-width: 800px) { .charts { grid-template-columns: 1fr; } }
  .chart-box { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .chart-box h3 { font-size: 14px; color: var(--muted); margin-bottom: 10px; font-weight: 500; }
  .live-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 10px; color: var(--muted); font-size: 12px; }
  .live-toolbar button { border: 1px solid var(--border); border-radius: 6px; background: var(--panel2); color: var(--text); padding: 7px 10px; font: inherit; cursor: pointer; }
  .live-toolbar button:hover { border-color: var(--accent); }
  #live-error { color: var(--up); }
  .live-table { min-width: 760px; }
  .live-table .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  .backtest-controls { display: flex; flex-wrap: wrap; align-items: end; gap: 10px; padding: 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
  .backtest-controls label { display: grid; gap: 5px; color: var(--muted); font-size: 12px; }
  .backtest-controls input, .backtest-controls button { min-height: 36px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel2); color: var(--text); padding: 7px 10px; font: inherit; }
  .backtest-controls button { cursor: pointer; }
  .backtest-controls button:hover { border-color: var(--accent); }
  .backtest-controls .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  #backtest-error { min-height: 18px; margin: 8px 0; color: var(--up); font-size: 12px; }
  #backtest-results[hidden] { display: none; }
  .backtest-chart { height: 320px; }
  .backtest-subtitle { margin: 24px 0 10px; font-size: 14px; color: var(--muted); font-weight: 500; }
  .table-scroll { overflow-x: auto; }
  .backtest-table { min-width: 700px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .card .head { display: flex; align-items: baseline; gap: 8px; }
  .card .head .icon { font-size: 20px; }
  .card .head .name { font-size: 16px; font-weight: 700; }
  .card .tag { font-size: 10px; padding: 2px 8px; border-radius: 20px; background: var(--panel2); color: var(--muted); margin-left: auto; white-space: nowrap; }
  .card .tag.live { color: #3fb950; }
  .card .desc { font-size: 13px; color: #b0b8c4; line-height: 1.7; margin: 10px 0; }
  .card .methods { display: flex; flex-wrap: wrap; gap: 6px; }
  .card .methods span { font-size: 11px; background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; color: var(--muted); }
  .card .perf { margin-top: 12px; font-size: 13px; color: var(--gold); font-weight: 600; }
  .timeline { position: relative; margin-left: 8px; padding-left: 24px; border-left: 2px solid var(--border); }
  .tl-item { position: relative; padding-bottom: 22px; }
  .tl-item::before { content: ""; position: absolute; left: -31px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); }
  .tl-item .date { font-size: 12px; color: var(--accent); font-weight: 600; }
  .tl-item .title { font-size: 15px; font-weight: 700; margin: 2px 0; }
  .tl-item .title .tag2 { font-size: 10px; background: var(--panel2); color: var(--gold); border-radius: 4px; padding: 2px 6px; margin-left: 8px; vertical-align: middle; }
  .tl-item .desc { font-size: 13px; color: #b0b8c4; line-height: 1.6; max-width: 760px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th, td { padding: 10px 14px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--border); }
  th { background: var(--panel2); color: var(--muted); font-weight: 500; }
  tr:last-child td { border-bottom: none; }
  td.num { font-variant-numeric: tabular-nums; }
  .pill { font-size: 11px; padding: 2px 10px; border-radius: 20px; }
  .pill.ok { background: rgba(63,185,80,.15); color: #3fb950; }
  footer { margin-top: 40px; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Hermes <span>策略数据中心</span></h1>
    <p id="meta-sub"></p>
  </header>

  <div class="kpis" id="kpis"></div>

  <h2>📡 实时行情</h2>
  <div class="live-toolbar">
    <span id="live-updated">上次更新时间 —</span>
    <span id="live-countdown">10 秒后刷新</span>
    <button type="button" id="live-toggle" aria-pressed="false">⏸ 暂停刷新</button>
    <span id="live-error" role="status"></span>
  </div>
  <div class="table-scroll">
    <table class="live-table">
      <thead><tr><th>名称</th><th>代码</th><th class="num">现价</th><th class="num">涨跌幅</th><th class="num">涨跌额</th><th class="num">开盘</th><th class="num">最高</th><th class="num">最低</th></tr></thead>
      <tbody id="live-body"></tbody>
    </table>
  </div>

  <h2>📊 纸盘模拟账户净值</h2>
  <div class="charts">
    <div class="chart-box"><h3>净值曲线（2026-05-28 起 · ¥50,000 初始资金）</h3><canvas id="navChart"></canvas></div>
    <div class="chart-box"><h3>交易盈亏分布（29 笔平仓）</h3><canvas id="pnlChart"></canvas></div>
  </div>

  <h2>🧠 策略与方法全景</h2>
  <div class="grid-cards" id="strategies"></div>

  <h2>🧪 指标回测</h2>
  <div class="backtest-controls">
    <label>开始日期<input id="backtest-start" type="date"></label>
    <label>结束日期<input id="backtest-end" type="date"></label>
    <button type="button" data-range="1m">近 1 月</button>
    <button type="button" data-range="3m">近 3 月</button>
    <button type="button" data-range="all">全区间</button>
    <button type="button" class="primary" id="run-backtest">运行回测</button>
  </div>
  <p id="backtest-error" role="status"></p>
  <div id="backtest-results" hidden>
    <div class="kpis" id="backtest-kpis"></div>
    <div class="chart-box" style="margin-top:14px">
      <h3>区间净值与回撤</h3>
      <div class="backtest-chart"><canvas id="backtest-chart"></canvas></div>
    </div>
    <h3 class="backtest-subtitle">三因子信号 FIFO 配对明细</h3>
    <div class="table-scroll">
      <table class="backtest-table">
        <thead><tr><th>买入日</th><th>卖出日</th><th>标的</th><th class="num">持有天数</th><th class="num">盈亏%</th></tr></thead>
        <tbody id="backtest-pairs"></tbody>
      </table>
    </div>
    <h3 class="backtest-subtitle">基准对照</h3>
    <div class="table-scroll">
      <table class="backtest-table">
        <thead><tr><th>基准</th><th class="num">区间收益</th><th>说明</th></tr></thead>
        <tbody id="backtest-benchmarks"></tbody>
      </table>
    </div>
  </div>

  <h2>🧬 策略演化时间线</h2>
  <div class="timeline" id="timeline"></div>

  <h2>交易记录</h2>
  <table id="tx-table">
    <thead><tr><th>日期</th><th>方向</th><th>标的</th><th class="num">价格</th><th class="num">股数</th><th class="num">盈亏</th><th class="num">盈亏%</th><th>触发原因</th></tr></thead>
    <tbody id="tx-body"></tbody>
  </table>

  <h2>⚙️ 定时任务矩阵</h2>
  <table>
    <thead><tr><th>任务</th><th>调度</th><th class="num">累计运行</th><th>状态</th></tr></thead>
    <tbody id="job-body"></tbody>
  </table>

  <footer id="footer"></footer>
</div>

<script src="data.js"></script>
<script src="backtest.js"></script>
<script>
const fmt = n => n.toLocaleString('zh-CN', {maximumFractionDigits: 1});
const yuan = n => '¥' + fmt(n);
const cls = n => n > 0 ? 'up' : (n < 0 ? 'down' : '');

// meta
document.getElementById('meta-sub').textContent =
  `数据来源: ${DATA.meta.source} · 统计区间: ${DATA.meta.period} · 生成于 ${DATA.meta.generated}`;

// KPIs
const k = DATA.kpis;
const kpis = [
  {label:'系统运行天数', value: k.days, sub:'自 2026-05-17'},
  {label:'定时任务累计执行', value: fmt(k.total_runs) + ' 次', sub:'14 个 cron 作业'},
  {label:'纸盘累计收益', value: (k.nav.return_pct>0?'+':'') + k.nav.return_pct + '%', cls: cls(k.nav.return_pct), sub:`${yuan(k.nav.current)} / 初始 ${yuan(k.nav.initial)}`},
  {label:'最大回撤', value: k.nav.max_dd + '%', cls:'down', sub:'2026-11 高点'},
  {label:'纸盘胜率', value: k.trades.win_rate + '%', cls:'down', sub:`${k.trades.sells} 笔平仓 · 已实现 ${yuan(k.trades.realized)}`},
  {label:'最佳单笔', value:'+' + k.trades.best.pct + '%', cls:'up', sub:k.trades.best.name + ' +' + yuan(k.trades.best.pnl)},
  {label:'隔夜预测准确率', value: k.overnight_acc.rate + '%', cls:'gold', sub:`${k.overnight_acc.hits}/${k.overnight_acc.total} 次闭环验证`},
  {label:'Demon Scout 胜率', value: k.demon.rate + '%', cls:'up', sub:`${k.demon.picks} 次选股 · +¥${k.demon.pnl}`},
  {label:'策略调优次数', value: k.tunes, sub:'全部留痕 changelog'},
];
document.getElementById('kpis').innerHTML = kpis.map(x =>
  `<div class="kpi"><div class="label">${x.label}</div><div class="value ${x.cls||''}">${x.value}</div><div class="sub">${x.sub}</div></div>`).join('');

// NAV chart
const nav = DATA.nav_series;
new Chart(document.getElementById('navChart'), {
  type: 'line',
  data: {
    labels: nav.map(d => d.date.slice(5)),
    datasets: [{
      label: 'NAV (¥)', data: nav.map(d => d.nav),
      borderColor: '#4e8ef7', backgroundColor: 'rgba(78,142,247,.12)',
      fill: true, pointRadius: 0, borderWidth: 2, tension: .25
    }]
  },
  options: {
    plugins: { legend: { display: false },
      tooltip: { callbacks: { label: c => yuan(c.parsed.y) + '  (' + (nav[c.dataIndex].ret>0?'+':'') + nav[c.dataIndex].ret + '%)' } } },
    scales: {
      x: { ticks: { color: '#8b949e', maxTicksLimit: 12 }, grid: { color: '#21262d' } },
      y: { ticks: { color: '#8b949e', callback: v => '¥' + (v/1000).toFixed(1) + 'k' }, grid: { color: '#21262d' } }
    }
  }
});

// PnL distribution (sells)
const sells = DATA.transactions.filter(t => t.action === 'SELL').reverse();
new Chart(document.getElementById('pnlChart'), {
  type: 'bar',
  data: {
    labels: sells.map(t => t.name),
    datasets: [{
      data: sells.map(t => t.pnl_pct),
      backgroundColor: sells.map(t => t.pnl_pct >= 0 ? '#f0506e' : '#2ea86e'),
      borderRadius: 3
    }]
  },
  options: {
    indexAxis: 'y', plugins: { legend: { display: false } },
    scales: {
      x: { ticks: { color: '#8b949e', callback: v => v + '%' }, grid: { color: '#21262d' } },
      y: { ticks: { color: '#8b949e', font: { size: 10 } }, grid: { display: false } }
    }
  }
});

// strategy cards
document.getElementById('strategies').innerHTML = DATA.strategies.map(s => `
  <div class="card">
    <div class="head"><span class="icon">${s.icon}</span><span class="name">${s.name}</span>
      <span class="tag ${s.status.includes('运行') ? 'live' : ''}">${s.status}</span></div>
    <div class="desc">${s.desc}</div>
    <div class="methods">${s.method.map(m => `<span>${m}</span>`).join('')}</div>
    <div class="perf">📌 ${s.perf}</div>
  </div>`).join('');

// timeline
document.getElementById('timeline').innerHTML = DATA.timeline.map(t => `
  <div class="tl-item">
    <div class="date">${t.date}</div>
    <div class="title">${t.title}<span class="tag2">${t.tag}</span></div>
    <div class="desc">${t.desc}</div>
  </div>`).join('');

// transactions
document.getElementById('tx-body').innerHTML = DATA.transactions.map(t => {
  if (t.action === 'BUY') return `<tr><td>${t.date}</td><td class="up">买入</td><td>${t.name} (${t.code})</td><td class="num">${t.price}</td><td class="num">${t.shares}</td><td class="num">—</td><td class="num">—</td><td>${t.reason}</td></tr>`;
  return `<tr><td>${t.date}</td><td class="${t.pnl>=0?'up':'down'}">卖出</td><td>${t.name} (${t.code})</td><td class="num">${t.price}</td><td class="num">${t.shares}</td><td class="num ${cls(t.pnl)}">${t.pnl>0?'+':''}${fmt(t.pnl)}</td><td class="num ${cls(t.pnl)}">${t.pnl_pct>0?'+':''}${t.pnl_pct}%</td><td>${t.reason}</td></tr>`;
}).join('');

// jobs
document.getElementById('job-body').innerHTML = DATA.jobs.map(j =>
  `<tr><td>${j.name}</td><td>${j.sched}</td><td class="num">${j.runs}</td><td><span class="pill ok">● 正常</span></td></tr>`).join('');

document.getElementById('footer').textContent =
  'Hermes Strategy Dashboard · 数据截止 2026-11-23 · 涨红跌绿 · 仅供策略研究参考，不构成投资建议';

// 回测面板
const backtestStart = document.getElementById('backtest-start');
const backtestEnd = document.getElementById('backtest-end');
const backtestError = document.getElementById('backtest-error');
const backtestResults = document.getElementById('backtest-results');
const backtestKpis = document.getElementById('backtest-kpis');
const navDates = DATA.nav_series.map(point => point.date);
backtestStart.min = navDates[0];
backtestStart.max = navDates[navDates.length - 1];
backtestStart.value = navDates[0];
backtestEnd.min = navDates[0];
backtestEnd.max = navDates[navDates.length - 1];
backtestEnd.value = navDates[navDates.length - 1];
let backtestChart = null;

const backtestPct = value => Number.isFinite(value)
  ? `${value > 0 ? '+' : ''}${fmt(value)}%`
  : '—';
const backtestPercentRatio = value => Number.isFinite(value) ? backtestPct(value * 100) : '—';
const backtestRatio = value => Number.isFinite(value) ? fmt(value) : '—';
const backtestClass = value => value > 0 ? 'up' : (value < 0 ? 'down' : '');
const backtestMetric = (label, value, className = '', sub = '') =>
  `<div class="kpi"><div class="label">${label}</div><div class="value ${className}">${value}</div><div class="sub">${sub}</div></div>`;

function runBacktest() {
  backtestError.textContent = '';
  if (!backtestStart.value || !backtestEnd.value || backtestStart.value > backtestEnd.value) {
    backtestError.textContent = '请选择有效的回测日期区间。';
    backtestResults.hidden = true;
    return;
  }

  const result = Backtester.run(backtestStart.value, backtestEnd.value);
  if (!result.range.nav_series.length) {
    backtestError.textContent = '所选区间内没有净值数据。';
    backtestResults.hidden = true;
    return;
  }

  const nav = result.nav;
  const trades = result.trades;
  const best = trades.bestTrade;
  const worst = trades.worstTrade;
  const metrics = [
    backtestMetric('累计收益率', backtestPercentRatio(nav.cumulativeReturn), backtestClass(nav.cumulativeReturn)),
    backtestMetric('年化收益率', backtestPercentRatio(nav.annualizedReturn), backtestClass(nav.annualizedReturn)),
    backtestMetric('最大回撤', backtestPercentRatio(nav.maxDrawdown), 'down', nav.drawdownStart ? `${nav.drawdownStart} 至 ${nav.drawdownEnd}` : '区间内无回撤'),
    backtestMetric('年化波动率', backtestPercentRatio(nav.annualizedVolatility), 'gold'),
    backtestMetric('夏普比率', backtestRatio(nav.sharpeRatio), backtestClass(nav.sharpeRatio), '无风险利率 1.5%'),
    backtestMetric('卡玛比率', backtestRatio(nav.calmarRatio), backtestClass(nav.calmarRatio)),
    backtestMetric('盈利日占比', backtestPercentRatio(nav.profitableDayRatio), backtestClass(nav.profitableDayRatio)),
    backtestMetric('平仓交易次数', fmt(trades.count)),
    backtestMetric('交易胜率', backtestPercentRatio(trades.winRate), backtestClass(trades.winRate)),
    backtestMetric('平均盈利', backtestPct(trades.averageWin), 'up'),
    backtestMetric('平均亏损', backtestPct(trades.averageLoss), 'down'),
    backtestMetric('盈亏比', backtestRatio(trades.winLossRatio), backtestClass(trades.winLossRatio)),
    backtestMetric('累计已实现盈亏', yuan(trades.realizedPnl), cls(trades.realizedPnl)),
    backtestMetric('最佳单笔', best ? `${backtestPct(best.pnl_pct)} · ${best.name}` : '—', best ? backtestClass(best.pnl_pct) : '', best ? yuan(best.pnl) : ''),
    backtestMetric('最差单笔', worst ? `${backtestPct(worst.pnl_pct)} · ${worst.name}` : '—', worst ? backtestClass(worst.pnl_pct) : '', worst ? yuan(worst.pnl) : ''),
    backtestMetric('隔夜预测准确率', backtestPercentRatio(result.overnight.accuracy), 'gold', `估算 ${fmt(result.overnight.estimatedHits)}/${fmt(result.overnight.estimatedTotal)} 次`),
    backtestMetric('FIFO 配对笔数', fmt(result.pairedTrades.length)),
    backtestMetric('平均持有天数', backtestRatio(result.averageHoldingDays)),
    backtestMetric('平均持有期收益', backtestPct(result.benchmarks.averageHoldingReturn), backtestClass(result.benchmarks.averageHoldingReturn))
  ];
  backtestKpis.innerHTML = metrics.join('');

  const dates = result.range.nav_series.map(point => point.date);
  const chartData = result.range.nav_series.map(point => point.nav);
  if (backtestChart) backtestChart.destroy();
  backtestChart = new Chart(document.getElementById('backtest-chart'), {
    type: 'line',
    data: {
      labels: dates.map(date => date.slice(5)),
      datasets: [
        {
          label: '净值 (¥)',
          data: chartData,
          borderColor: '#4e8ef7',
          backgroundColor: 'rgba(78,142,247,.12)',
          fill: true,
          pointRadius: 0,
          borderWidth: 2,
          tension: .2,
          yAxisID: 'nav'
        },
        {
          label: '回撤 (%)',
          data: nav.drawdowns.map(value => value * 100),
          borderColor: '#2ea86e',
          backgroundColor: 'rgba(46,168,110,.14)',
          fill: true,
          pointRadius: 0,
          borderWidth: 1,
          tension: .15,
          yAxisID: 'drawdown'
        }
      ]
    },
    options: {
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { color: '#8b949e' } } },
      scales: {
        x: { ticks: { color: '#8b949e', maxTicksLimit: 12 }, grid: { color: '#21262d' } },
        nav: { position: 'left', ticks: { color: '#8b949e', callback: value => '¥' + (value / 1000).toFixed(1) + 'k' }, grid: { color: '#21262d' } },
        drawdown: { position: 'right', ticks: { color: '#2ea86e', callback: value => value + '%' }, grid: { drawOnChartArea: false } }
      }
    }
  });

  document.getElementById('backtest-pairs').innerHTML = result.pairedTrades.length
    ? result.pairedTrades.map(trade => `<tr><td>${trade.buyDate}</td><td>${trade.sellDate}</td><td>${trade.name} (${trade.code})</td><td class="num">${fmt(trade.holdingDays)}</td><td class="num ${backtestClass(trade.returnPct)}">${backtestPct(trade.returnPct)}</td></tr>`).join('')
    : '<tr><td colspan="5">区间内没有完整的买入/卖出配对。</td></tr>';
  document.getElementById('backtest-benchmarks').innerHTML = `
    <tr><td>持有现金</td><td class="num">0.0%</td><td>基准收益为 0%</td></tr>
    <tr><td>平均持有期收益</td><td class="num ${backtestClass(result.benchmarks.averageHoldingReturn)}">${backtestPct(result.benchmarks.averageHoldingReturn)}</td><td>${result.pairedTrades.length} 笔 FIFO 配对的等权平均收益</td></tr>`;
  backtestResults.hidden = false;
}

document.getElementById('run-backtest').addEventListener('click', runBacktest);
document.querySelectorAll('[data-range]').forEach(button => {
  button.addEventListener('click', () => {
    const end = navDates[navDates.length - 1];
    backtestEnd.value = end;
    if (button.dataset.range === 'all') {
      backtestStart.value = navDates[0];
    } else {
      const startDate = new Date(`${end}T00:00:00Z`);
      startDate.setUTCMonth(startDate.getUTCMonth() - (button.dataset.range === '1m' ? 1 : 3));
      backtestStart.value = startDate.toISOString().slice(0, 10) < navDates[0]
        ? navDates[0]
        : startDate.toISOString().slice(0, 10);
    }
    runBacktest();
  });
});
runBacktest();

const LIVE_STOCKS = [
  { code: 'sh000001', name: '上证指数', group: '指数' },
  { code: 'sz399006', name: '创业板指', group: '指数' },
  { code: 'sh000922', name: '中证红利', group: '指数' },
  { code: 'sh600219', name: '南山铝业', group: '持仓复盘' },
  { code: 'sz002340', name: '格林美', group: '持仓复盘' },
  { code: 'sh603155', name: '新亚强', group: '红塔创新' },
  { code: 'sh605287', name: '德才股份', group: '红塔创新' },
  { code: 'sz000811', name: '冰轮环境', group: '红塔创新' },
  { code: 'sh688591', name: '煜邦电力', group: '红塔创新' },
  { code: 'sz300355', name: '武汉天源', group: '红塔创新' }
];
const liveBody = document.getElementById('live-body');
const liveUpdated = document.getElementById('live-updated');
const liveCountdown = document.getElementById('live-countdown');
const liveError = document.getElementById('live-error');
const liveToggle = document.getElementById('live-toggle');
let livePaused = false;
let liveSecondsRemaining = 10;
let liveRequestPending = false;

const liveHasNumber = value => value !== null && value !== undefined && value !== '' && Number.isFinite(Number(value));
const liveNumber = value => liveHasNumber(value)
  ? Number(value).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
  : '—';

function renderLiveQuotes(quotes) {
  const quoteMap = new Map(quotes.map(quote => [quote.code, quote]));
  liveBody.replaceChildren();
  LIVE_STOCKS.forEach(stock => {
    const quote = quoteMap.get(stock.code);
    const row = document.createElement('tr');
    const nameCell = document.createElement('td');
    nameCell.textContent = quote && quote.name ? quote.name : stock.name;
    const codeCell = document.createElement('td');
    codeCell.textContent = stock.code;
    row.append(nameCell, codeCell);
    const change = quote && liveHasNumber(quote.price) && liveHasNumber(quote.prevClose)
      ? Number(quote.price) - Number(quote.prevClose)
      : NaN;
    const values = [
      quote ? quote.price : null,
      quote ? quote.changePct : null,
      change,
      quote ? quote.open : null,
      quote ? quote.high : null,
      quote ? quote.low : null
    ];
    values.forEach((value, index) => {
      const cell = document.createElement('td');
      cell.className = 'num';
      cell.textContent = index === 1 && liveHasNumber(value)
        ? `${Number(value) > 0 ? '+' : ''}${liveNumber(value)}%`
        : liveNumber(value);
      if (index === 1 || index === 2) {
        const numericValue = Number(value);
        if (liveHasNumber(value)) cell.classList.add(numericValue > 0 ? 'up' : numericValue < 0 ? 'down' : '');
      }
      row.appendChild(cell);
    });
    liveBody.appendChild(row);
  });
}

async function refreshLiveQuotes() {
  if (liveRequestPending) return;
  liveRequestPending = true;
  try {
    const codes = LIVE_STOCKS.map(stock => stock.code).join(',');
    const response = await fetch(`/api/quotes?codes=${encodeURIComponent(codes)}`);
    const result = await response.json();
    if (!response.ok || !Array.isArray(result)) throw new Error(result.error || '行情响应格式错误');
    renderLiveQuotes(result);
    liveUpdated.textContent = `上次更新时间 ${new Date().toLocaleTimeString('zh-CN', { hour12: false })}`;
    liveError.textContent = '';
  } catch (error) {
    liveError.textContent = `⚠️ 行情获取失败：${error.message || '请检查本地服务'}`;
  } finally {
    liveRequestPending = false;
    liveSecondsRemaining = 10;
  }
}

liveToggle.addEventListener('click', () => {
  livePaused = !livePaused;
  liveToggle.textContent = livePaused ? '▶ 继续刷新' : '⏸ 暂停刷新';
  liveToggle.setAttribute('aria-pressed', String(livePaused));
  if (!livePaused) {
    liveSecondsRemaining = 0;
    refreshLiveQuotes();
  }
});
refreshLiveQuotes();
setInterval(() => {
  if (livePaused) {
    liveCountdown.textContent = '刷新已暂停';
    return;
  }
  liveCountdown.textContent = `${liveSecondsRemaining} 秒后刷新`;
  if (liveSecondsRemaining > 0) liveSecondsRemaining -= 1;
}, 1000);
setInterval(() => {
  if (!livePaused) refreshLiveQuotes();
}, 10000);
</script>
